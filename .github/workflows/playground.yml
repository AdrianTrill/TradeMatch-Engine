name: Playground

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  EMSCRIPTEN_VERSION: "7.0.0"

jobs:
  build:
    name: WebAssembly build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Emscripten
        uses: mymindstorm/setup-emsdk@v16
        with:
          version: ${{ env.EMSCRIPTEN_VERSION }}
          actions-cache-folder: emsdk-cache

      - name: Configure
        run: >
          emcmake cmake -S . -B build-wasm -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
          -DTRADEMATCH_WARNINGS_AS_ERRORS=ON

      - name: Build the site
        run: cmake --build build-wasm --target tradematch_site --parallel

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      # Every golden scenario must produce, in WebAssembly, the same transcript the native command line does.
      - name: Check the WebAssembly build
        run: node web/check.mjs build-wasm/site tests/scenarios

      - name: Upload the site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build-wasm/site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
