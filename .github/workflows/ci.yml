name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_TOOLS_VERSION: "22.1.8"
  GCOVR_VERSION: "8.8"
  PYBIND11_VERSION: "3.1.0"

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux / GCC
            os: ubuntu-latest
            compiler: -DCMAKE_CXX_COMPILER=g++
          - name: Linux / Clang
            os: ubuntu-latest
            compiler: -DCMAKE_CXX_COMPILER=clang++
          - name: macOS / Apple Clang
            os: macos-latest
            compiler: -DCMAKE_CXX_COMPILER=clang++
          - name: Windows / MSVC
            os: windows-latest
            compiler: ""

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DTRADEMATCH_WARNINGS_AS_ERRORS=ON ${{ matrix.compiler }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build --build-config Release --output-on-failure

  sanitizers:
    name: Sanitizers / ASan + UBSan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++
          -DTRADEMATCH_WARNINGS_AS_ERRORS=ON -DTRADEMATCH_SANITIZERS=address,undefined

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1:detect_stack_use_after_return=1:check_initialization_order=1:strict_string_checks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ctest --test-dir build --output-on-failure

  thread-sanitizer:
    name: Sanitizers / TSan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_CXX_COMPILER=clang++
          -DTRADEMATCH_WARNINGS_AS_ERRORS=ON -DTRADEMATCH_SANITIZERS=thread

      - name: Build
        run: cmake --build build --parallel

      # ThreadSanitizer's shadow memory layout doesn't fit the 32 bits of mmap randomization recent Ubuntu kernels use.
      - name: Reduce address-space randomization for ThreadSanitizer
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Test
        env:
          TSAN_OPTIONS: halt_on_error=1:second_deadlock_stack=1
        run: ctest --test-dir build --output-on-failure

  format:
    name: Format / clang-format
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install clang-format
        run: pip install "clang-format==${LLVM_TOOLS_VERSION}"

      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror

  lint:
    name: Lint / clang-tidy
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install clang-tidy and pybind11
        run: pip install "clang-tidy==${LLVM_TOOLS_VERSION}" "pybind11==${PYBIND11_VERSION}"

      - name: Export compile commands
        # With the Python module, so that its binding is linted against pybind11's headers.
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=clang++
          -DTRADEMATCH_PYTHON=ON -DPython_EXECUTABLE="$(command -v python)" -Dpybind11_DIR="$(python -m pybind11 --cmakedir)"

      - name: Run clang-tidy
        # The WebAssembly binding in web/ only compiles with Emscripten; the Playground workflow builds it with -Werror.
        run: git ls-files '*.cpp' ':!web/*' | xargs -P "$(nproc)" -n 1 clang-tidy -p build --quiet

  python:
    name: Python / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
          - name: macOS
            os: macos-latest
          - name: Windows
            os: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build and install the package
        run: pip install ".[test]" --config-settings=cmake.define.TRADEMATCH_WARNINGS_AS_ERRORS=ON

      - name: Test
        run: pytest -v

      - name: Run the notebook
        # Without NASDAQ's file, the real-data section explains how to get it and skips.
        if: runner.os == 'Linux'
        run: |
          pip install numpy pandas matplotlib nbconvert ipykernel
          jupyter nbconvert --to notebook --execute --output "$RUNNER_TEMP/notebook.ipynb" \
            notebooks/market_microstructure.ipynb

  coverage:
    name: Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install gcovr
        run: pip install "gcovr==${GCOVR_VERSION}"

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++ -DTRADEMATCH_COVERAGE=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Report engine coverage
        run: |
          mkdir -p coverage
          gcovr --root . --object-directory build --gcov-exclude-directories '.*tradematch_benchmark\.dir.*' \
            --filter 'src/' --filter 'include/' \
            --exclude-unreachable-branches --exclude-throw-branches \
            --html-details coverage/index.html --html-title "TradeMatch Engine coverage" \
            --json-summary coverage/summary.json --json-summary-pretty \
            --markdown-summary coverage/summary.md --markdown-title "Engine coverage" \
            --print-summary --fail-under-line 95
          cat coverage/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: ignore
